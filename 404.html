<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halaman tidak ditemukan — SectorChat</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07101F" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop-glow backdrop-glow--top"></span>
    <span class="backdrop-glow backdrop-glow--bottom"></span>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="SectorChat, ke halaman utama">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3B82F6" />
              <stop offset="100%" stop-color="#38BDF8" />
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="14" fill="url(#brandGradient)" />
          <path
            d="M24 12c-6.6 0-12 4.9-12 11 0 3.3 1.6 6.2 4.2 8.2V37l5.1-2.7c.9-.2 1.8-.3 2.7-.3 6.6 0 12-4.9 12-11S30.6 12 24 12z"
            fill="#07101F"
            opacity="0.92"
          />
          <rect x="18" y="20.5" width="12" height="2.6" rx="1.3" fill="#BFDBFE" />
          <rect x="18" y="25" width="7.5" height="2.6" rx="1.3" fill="#BFDBFE" />
        </svg>
        <span class="brand-name">SectorChat</span>
      </a>
    </div>
  </header>

  <main class="error-page">
    <div class="container">
      <p class="error-code">404</p>
      <h1 class="section-title">Halaman tidak ditemukan</h1>
      <p class="error-lead">
        Tautan yang Anda buka mungkin sudah dipindahkan atau tidak pernah ada.
      </p>
      <a class="btn btn--primary btn--lg" href="/">Kembali ke beranda</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-legal">
        © <span data-year>2026</span> SectorChat. Seluruh hak cipta dilindungi.
      </p>
    </div>
  </footer>

  <script src="/assets/script.js" defer></script>
</body>
</html>
